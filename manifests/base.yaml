apiVersion: v1
kind: Namespace
metadata: {name: apps}
---
apiVersion: v1
kind: Namespace
metadata: {name: registry}
---
apiVersion: v1
kind: Namespace
metadata: {name: jenkins}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: registry}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /v2/, port: 5000}}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: registry}
spec:
  type: NodePort
  selector: {app: registry}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: jenkins-deployer, namespace: jenkins}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: jenkins-deployer-edit, namespace: apps}
subjects: [{kind: ServiceAccount, name: jenkins-deployer, namespace: jenkins}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
---
# Группа, которую Teleport-роль lab-auditor имперсонирует в Kubernetes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: lab-readonly-view}
subjects: [{kind: Group, name: lab-readonly, apiGroup: rbac.authorization.k8s.io}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
